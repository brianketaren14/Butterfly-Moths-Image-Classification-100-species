<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ButterflyOracle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        #background {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: -1;
            background-image: url('static/bg2.png');
            background-size: cover;
        }

        .doto {
            font-family: "Doto", sans-serif;
            font-weight: bold;
        }

        .montserrat {
            font-family: "Montserrat", sans-serif;
        }

        input[name="image"] {
            width: 80%;
        }

        .bg-card {
            background-color: rgba(33, 37, 41, 0.7);
        }
    </style>

</head>

<body>
    <section id="background">

    </section>
    <nav class="navbar navbar-expand-lg bg-transparent">
        <div class="container">
            <a class="navbar-brand doto" href="{{url_for('index')}}">
                <img src="static/icon.png" alt="Logo" width="35" height="24" class="d-inline-block align-text-top">
                ButterflyOracle
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active montserrat" aria-current="page" href="{{url_for('index')}}"><b>Home</b></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active montserrat" href="{{url_for('about')}}"><b>About</b></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    {% block content%}{%endblock%}
    <footer class="border-top mt-5">
        <div class="container d-flex flex-wrap justify-content-between align-items-center py-3">
            <div class="col-md-4 d-flex align-items-center">
                <a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1">
                    <img src="static/icon.png" width="40" height="40">
                </a>
                <span class="mb-3 mb-md-0 doto">© 2024 <b>ButterflyOracle</b>, Inc</span>
            </div>
    
            <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
                <li class="ms-3"><a class="text-body-secondary" href="#"><img src="static/facebook.png" width="24"
                            height="24"></a></li>
                <li class="ms-3"><a class="text-body-secondary" href="#"><img src="static/twitter.png" width="24"
                            height="24"></a>
                </li>
                <li class="ms-3"><a class="text-body-secondary" href="#"><img src="static/instagram.png" width="24"
                            height="24"></a></li>
            </ul>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script>
            function tampilkanGambar(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const imgElement = document.getElementById('preview');
                        const imgUpload = document.getElementById('upload');
                        imgUpload.style.display = 'none';
                        imgElement.src = e.target.result;
                        imgElement.style.display = 'block';
                    }
                    reader.readAsDataURL(file);
                }
            }

    </script>
</body>

</html>
